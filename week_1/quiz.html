<head>

<style>
  * { box-sizing: border-box; }

  header {

  header p { margin: 0; opacity: 0.9; }
  .score-bar {
    background: white; padding: 16px 24px; border-radius: 10px;
    margin-bottom: 24px; display: flex; justify-content: space-between;

  .score-bar .stat { font-weight: 600; }

  .reset-btn {
    background: #512bd4; color: white; border: none;
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9em;
  }
  .reset-btn:hover { background: #3a1f9e; }
  .section {
    background: white; border-radius: 12px; padding: 24px;
    margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .section h2 {
    color: #512bd4; margin-top: 0;
    border-bottom: 2px solid #eee; padding-bottom: 12px;
  }
  .question { padding: 18px 0; border-bottom: 1px solid #eee; }
  .question:last-child { border-bottom: none; }
  .q-text { font-weight: 600; margin: 0 0 12px; }
  .q-number {
    background: #512bd4; color: white; border-radius: 50%;
    width: 26px; height: 26px; display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 0.85em; margin-right: 8px;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    padding: 10px 14px; border: 1.5px solid #ddd; border-radius: 8px;
    cursor: pointer; transition: all 0.15s; background: #fafafa;
  }
  .option:hover { border-color: #512bd4; background: #f5f0ff; }
  .option.correct { border-color: #2e7d32; background: #e8f5e9; color: #1b5e20; font-weight: 600; }
  .option.wrong { border-color: #c62828; background: #ffebee; color: #b71c1c; }
  .option.disabled { cursor: default; }
  .option.disabled:hover { background: #fafafa; border-color: #ddd; }
  .option.correct.disabled:hover { background: #e8f5e9; border-color: #2e7d32; }
  .option.wrong.disabled:hover { background: #ffebee; border-color: #c62828; }
  .feedback {
    margin-top: 12px; padding: 12px 16px; border-radius: 8px;
    font-size: 0.95em; display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #e8f5e9; border-left: 4px solid #2e7d32; color: #1b5e20; }
  .feedback.wrong { background: #ffebee; border-left: 4px solid #c62828; color: #b71c1c; }

    margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed rgba(0,0,0,0.15);
    color: #444; font-style: italic;
  }
  .tf-buttons { display: flex; gap: 10px; }
  .tf-btn {
    flex: 1; padding: 12px; border: 1.5px solid #ddd; border-radius: 8px;
    background: #fafafa; cursor: pointer; font-size: 1em;
    font-weight: 600; transition: all 0.15s;
  }
  .tf-btn:hover { border-color: #512bd4; background: #f5f0ff; }
  .tf-btn.correct { border-color: #2e7d32; background: #e8f5e9; color: #1b5e20; }
  .tf-btn.wrong { border-color: #c62828; background: #ffebee; color: #b71c1c; }
  .tf-btn.disabled { cursor: default; }

  .match-left {
    flex: 1; min-width: 180px; font-weight: 600;
    padding: 10px 14px; background: #f5f0ff; border-radius: 8px;
  }
  .match-select {
    flex: 1; min-width: 180px; padding: 10px; border: 1.5px solid #ddd;
    border-radius: 8px; font-size: 0.95em; background: white; cursor: pointer;
  }
  .match-select:focus { outline: none; border-color: #512bd4; }
  .match-select.correct { border-color: #2e7d32; background: #e8f5e9; }
  .match-select.wrong { border-color: #c62828; background: #ffebee; }
  .check-btn {
    background: #512bd4; color: white; border: none;
    padding: 10px 20px; border-radius: 8px; cursor: pointer;
    font-size: 0.95em; margin-top: 10px;
  }
  .check-btn:hover { background: #3a1f9e; }
  .check-btn:disabled { background: #ccc; cursor: default; }
  @media (max-width: 600px) {
    .match-row { flex-direction: column; align-items: stretch; }
    .match-left, .match-select { min-width: auto; }
  }
</style>

      { type:"tf", q:"Το ASP.NET MVC 3 εισήγαγε το Web API.", correct:false, tip:"Το Web API εισήχθη στο MVC 4 σύμφωνα με το PDF." },
      { type:"tf", q:"Το Blazor είναι framework για SPAs με C#.", correct:true, tip:"Blazor. Modern SPA framework με C#." },
      { type:"tf", q:"Το Visual Studio Code είναι πλήρες IDE με όλα τα εργαλεία του Visual Studio.", correct:false, tip:"Δε διαθέτει το σύνολο των εργαλείων του Visual Studio και απαιτεί επεκτάσεις ή πρόσθετα." },
      { type:"tf", q:"Το .NET SDK είναι απαραίτητο για ανάπτυξη ASP.NET Core.", correct:true, tip:"Αποτελεί προαπαιτούμενο για οποιαδήποτε εργασία σε ASP.NET Core και ASP.NET." },
      { type:"tf", q:"Το .NET Framework διατίθεται ως open source.", correct:false, tip:"Το .NET Framework ήταν κλειστό και εμπορικά προστατευμένο λογισμικό." }
    ]
  },
  {
    title: "Μέρος Δ: Αντιστοίχισης",
    questions: [
      {
        type:"match",
        q:"Αντιστοιχίστε τις εκδόσεις του .NET Framework με το έτος κυκλοφορίας τους.",
        pairs:[
          { left:".NET Framework 1.0", right:"2002" },
          { left:".NET Framework 2.0", right:"2005" },
          { left:".NET Framework 3.0", right:"2006" },
          { left:".NET Framework 4.0", right:"2010" },
          { left:".NET Framework 4.8", right:"2019" }
        ],
        tip:"Σύμφωνα με την Εικόνα 1 του PDF (Ιστορική εξέλιξη .NET Framework)."
      },
      {
        type:"match",
        q:"Αντιστοιχίστε τα frameworks του ASP.NET με την κύρια χρήση τους.",
        pairs:[
          { left:"ASP.NET Web Forms", right:"Event-driven programming" },
          { left:"ASP.NET MVC", right:"Model-View-Controller" },
          { left:"ASP.NET Web API", right:"RESTful APIs" },
          { left:"ASP.NET SignalR", right:"Real-time communication" }
        ],
        tip:"Σύμφωνα με την Εικόνα 7 του PDF (Βασικά στοιχεία ASP.NET πριν το ASP.NET Core)."
      },
      {
        type:"match",
        q:"Αντιστοιχίστε τις εκδόσεις .NET με το έτος κυκλοφορίας τους.",
        pairs:[
          { left:".NET Core 1.0", right:"2016" },
          { left:".NET Core 2.0", right:"2017" },
          { left:".NET Core 3.0", right:"2019" },
          { left:".NET 5", right:"2020" },
          { left:".NET 6", right:"2021" }
        ],
        tip:"Σύμφωνα με τις Εικόνες 2, 3 και 8 του PDF (Ιστορική εξέλιξη .NET Core και .NET)."
      }
    ]
  }
];

let state = { answered: 0, correct: 0, total: 0 };

function countTotal() {
  let t = 0;
  sections.forEach(s => s.questions.forEach(q => t++));
  return t;
}

function render() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';
  state = { answered: 0, correct: 0, total: countTotal() };
  let globalIndex = 0;

  sections.forEach(section => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section';
    const h2 = document.createElement('h2');
    h2.textContent = section.title;
    secDiv.appendChild(h2);

    section.questions.forEach(q => {
      globalIndex++;
      const qDiv = document.createElement('div');
      qDiv.className = 'question';

      const qText = document.createElement('p');
      qText.className = 'q-text';
      qText.innerHTML = '<span class="q-number">' + globalIndex + '</span>' + escapeHtml(q.q);
      qDiv.appendChild(qText);

      if (q.type === 'mcq') renderMCQ(qDiv, q);
      else if (q.type === 'tf') renderTF(qDiv, q);
      else if (q.type === 'match') renderMatch(qDiv, q);

      secDiv.appendChild(qDiv);
    });

    quiz.appendChild(secDiv);
  });

  updateScore();
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function renderMCQ(qDiv, q) {
  const opts = document.createElement('div');
  opts.className = 'options';
  q.options.forEach((opt, idx) => {
    const o = document.createElement('div');
    o.className = 'option';
    o.textContent = String.fromCharCode(97 + idx) + ') ' + opt;
    o.onclick = () => {
      if (o.classList.contains('disabled')) return;
      const isCorrect = idx === q.correct;
      opts.querySelectorAll('.option').forEach((el, i) => {
        el.classList.add('disabled');
        if (i === q.correct) el.classList.add('correct');
      });
      if (!isCorrect) o.classList.add('wrong');
      showFeedback(qDiv, isCorrect, q.tip, q.options[q.correct]);
      state.answered++;
      if (isCorrect) state.correct++;
      updateScore();
    };
    opts.appendChild(o);
  });
  qDiv.appendChild(opts);
}

function renderTF(qDiv, q) {
  const wrap = document.createElement('div');
  wrap.className = 'tf-buttons';
  [['Σωστό', true], ['Λάθος', false]].forEach(([label, val]) => {
    const b = document.createElement('button');
    b.className = 'tf-btn';
    b.textContent = label;
    b.onclick = () => {
      if (b.classList.contains('disabled')) return;
      const isCorrect = val === q.correct;
      wrap.querySelectorAll('.tf-btn').forEach(el => {
        el.classList.add('disabled');
        const elVal = el.textContent === 'Σωστό';
        if (elVal === q.correct) el.classList.add('correct');
      });
      if (!isCorrect) b.classList.add('wrong');
      showFeedback(qDiv, isCorrect, q.tip, q.correct ? 'Σωστό' : 'Λάθος');
      state.answered++;
      if (isCorrect) state.correct++;
      updateScore();
    };
    wrap.appendChild(b);
  });
  qDiv.appendChild(wrap);
}

function renderMatch(qDiv, q) {
  const allRights = q.pairs.map(p => p.right);
  const sortedRights = [...allRights].sort();
  q.pairs.forEach(pair => {
    const row = document.createElement('div');
    row.className = 'match-row';
    const left = document.createElement('div');
    left.className = 'match-left';
    left.textContent = pair.left;
    const sel = document.createElement('select');
    sel.className = 'match-select';
    const def = document.createElement('option');
    def.value = ''; def.textContent = '-- Επιλέξτε --';
    sel.appendChild(def);
    sortedRights.forEach(r => {
      const o = document.createElement('option');
      o.value = r; o.textContent = r;
      sel.appendChild(o);
    });
    row.appendChild(left);
    row.appendChild(sel);
    qDiv.appendChild(row);
  });

  const btn = document.createElement('button');
  btn.className = 'check-btn';
  btn.textContent = 'Έλεγχος';
  btn.onclick = () => {
    const sels = qDiv.querySelectorAll('.match-select');
    let allOk = true;
    sels.forEach((sel, i) => {
      sel.disabled = true;
      if (sel.value === q.pairs[i].right) {
        sel.classList.add('correct');
      } else {
        sel.classList.add('wrong');
        allOk = false;
      }
    });
    btn.disabled = true;
    showFeedback(qDiv, allOk, q.tip, null);
    state.answered++;
    if (allOk) state.correct++;
    updateScore();
  };
  qDiv.appendChild(btn);
}

function showFeedback(qDiv, isCorrect, tip, correctAnswer) {
  const fb = document.createElement('div');
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  let html = isCorrect
    ? '<strong>✔ Σωστό!</strong>'
    : '<strong>✘ Λάθος.</strong>' + (correctAnswer ? ' Η σωστή απάντηση είναι: <strong>' + escapeHtml(correctAnswer) + '</strong>.' : ' Δείτε τις σωστές αντιστοιχίσεις παραπάνω.');
  html += '<div class="tip">💡 ' + escapeHtml(tip) + '</div>';
  fb.innerHTML = html;
  qDiv.appendChild(fb);
}

function updateScore() {
  document.getElementById('answered').textContent = state.answered;
  document.getElementById('total').textContent = state.total;
  document.getElementById('correct').textContent = state.correct;
  const pct = state.answered === 0 ? 0 : Math.round((state.correct / state.answered) * 100);
  document.getElementById('percent').textContent = pct + '%';
}

function resetQuiz() {
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
